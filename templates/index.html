<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XochiLens - Sistema Experto Puebla</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f2f7f2; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 480px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #2E7D32; font-size: 22px; margin-bottom: 2px; }
        p { color: #555; font-size: 13px; margin-bottom: 15px; }
        .video-box { position: relative; width: 100%; max-height: 350px; background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: auto; display: block; }
        canvas { display: none; }
        .btn-capture { background-color: #2E7D32; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3); }
        .btn-capture:active { background-color: #1b4d20; }
        .result-box { margin-top: 20px; text-align: left; background: #f9fbf9; padding: 15px; border-radius: 12px; border-left: 5px solid #2E7D32; display: none; }
        .result-box h3 { color: #2E7D32; margin-top: 0; font-size: 16px; }
        .result-box p { margin: 6px 0; color: #333; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 XochiLens</h1>
        <p>Identificación de Flora y Fauna de Puebla Capital</p>

        <!-- Visor de cámara en tiempo real -->
        <div class="video-box">
            <video id="video" autoplay playsinline></video>
        </div>
        <canvas id="canvas"></canvas>

        <button class="btn-capture" onclick="captureAndAnalyze()">📸 Capturar y Ver Ficha Técnica</button>

        <div id="loading" style="display:none; margin-top: 15px; color: #2E7D32; font-weight: bold; font-size: 14px;">Procesando características biológicas...</div>

        <div id="resultBox" class="result-box">
            <h3 id="resTitle"></h3>
            <p><strong>Científico:</strong> <span id="resCientifico"></span></p>
            <p><strong>Común:</strong> <span id="resComun"></span></p>
            <p><strong>Náhuatl:</strong> <span id="resNahua"></span></p>
            <p><strong>Morfología:</strong> <span id="resMorfologia"></span></p>
            <p><strong>Ecología:</strong> <span id="resEcologia"></span></p>
            <p><strong>Estatus:</strong> <span id="resEstatus"></span></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // Inicializar cámara trasera en dispositivos móviles automáticamente
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Permiso de cámara requerido para escanear en campo."); });

        async function captureAndAnalyze() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async function(blob) {
                let formData = new FormData();
                formData.append("file", blob, "capture.jpg");

                document.getElementById('loading').style.display = 'block';
                document.getElementById('resultBox').style.display = 'none';

                try {
                    let response = await fetch('/analizar-especie/', {
                        method: 'POST',
                        body: formData
                    });
                    let data = await response.json();
                    document.getElementById('loading').style.display = 'none';

                    if (response.ok && data.ficha_tecnica) {
                        let f = data.ficha_tecnica;
                        document.getElementById('resTitle').innerText = "✓ Identificado (" + data.similitud + ")";
                        document.getElementById('resCientifico').innerText = f.nombre_cientifico;
                        document.getElementById('resComun').innerText = f.nombre_comun;
                        document.getElementById('resNahua').innerText = f.nombre_nahua;
                        document.getElementById('resMorfologia').innerText = f.morfologia;
                        document.getElementById('resEcologia').innerText = f.ecologia_ciclo;
                        document.getElementById('resEstatus').innerText = f.estatus_ecologico;
                        document.getElementById('resultBox').style.display = 'block';
                    } else {
                        alert("Especie no concluyente o fuera del catálogo núcleo.");
                    }
                } catch (e) {
                    document.getElementById('loading').style.display = 'none';
                    alert("Error de conexión con el servidor experto.");
                }
            }, 'image/jpeg', 0.85);
        }
    </script>
</body>
</html>
